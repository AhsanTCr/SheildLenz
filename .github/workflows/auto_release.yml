name: Auto Version Bump and Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Bump Version & Prepare Signing Keystore
        run: |
          CURRENT_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          NEW_CODE=$((CURRENT_CODE + 1))

          CURRENT_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          MAJOR_PART=$(echo "$CURRENT_NAME" | cut -d. -f1)
          MINOR_RAW=$(echo "$CURRENT_NAME" | cut -d. -f2)

          if [ "$MINOR_RAW" = "$CURRENT_NAME" ] || [ -z "$MINOR_RAW" ]; then
            MINOR_PART=0
          elif [ "${#MINOR_RAW}" -eq 1 ]; then
            MINOR_PART=$((10#$MINOR_RAW * 10))
          else
            MINOR_PART=$((10#${MINOR_RAW:0:2}))
          fi

          TOTAL_HUNDREDTHS=$((10#$MAJOR_PART * 100 + MINOR_PART))
          INCREMENT=$(shuf -i 55-85 -n 1)
          NEW_TOTAL=$((TOTAL_HUNDREDTHS + INCREMENT))

          NEW_MAJOR=$((NEW_TOTAL / 100))
          NEW_MINOR=$((NEW_TOTAL % 100))
          NEW_NAME=$(printf "%d.%02d" "$NEW_MAJOR" "$NEW_MINOR")

          echo "Bumping version (+0.${INCREMENT}): v$CURRENT_NAME ($CURRENT_CODE) -> v$NEW_NAME ($NEW_CODE)"

          sed -i -E "s/(versionCode\s*=\s*)$CURRENT_CODE/\1$NEW_CODE/" app/build.gradle.kts
          sed -i -E "s/(versionName\s*=\s*\")$CURRENT_NAME(\")/\1$NEW_NAME\2/" app/build.gradle.kts

          echo "NEW_NAME=$NEW_NAME" >> "$GITHUB_ENV"
          echo "NEW_CODE=$NEW_CODE" >> "$GITHUB_ENV"
          echo "INCREMENT_LABEL=0.${INCREMENT}" >> "$GITHUB_ENV"

          # Prepare and strictly verify canonical matching release keystore
          # Canonical SHA256: 99:E4:CB:C4:F6:04:31:90:F1:66:D6:C7:8B:71:AD:CE:6F:7E:CB:2F:B3:2F:EB:3E:95:7C:25:20:3A:A9:BE:AF
          EXPECTED_SHA256="99:E4:CB:C4:F6:04:31:90:F1:66:D6:C7:8B:71:AD:CE:6F:7E:CB:2F:B3:2F:EB:3E:95:7C:25:20:3A:A9:BE:AF"
          rm -f /tmp/release.jks /tmp/debug_restored.jks

          if [ -f "my-upload-key.jks" ]; then
            KEY_SHA=$(keytool -list -v -keystore "my-upload-key.jks" -storepass android -alias upload 2>/dev/null | grep -oP 'SHA256:\s*\K[0-9A-Fa-f:]+' | tr '[:lower:]' '[:upper:]' || true)
            if [ "$KEY_SHA" = "$EXPECTED_SHA256" ]; then
              cp my-upload-key.jks /tmp/release.jks
            fi
          fi

          if [ ! -f "/tmp/release.jks" ] && [ -f "debug.keystore" ]; then
            KEY_SHA=$(keytool -list -v -keystore "debug.keystore" -storepass android -alias androiddebugkey 2>/dev/null | grep -oP 'SHA256:\s*\K[0-9A-Fa-f:]+' | tr '[:lower:]' '[:upper:]' || true)
            if [ "$KEY_SHA" = "$EXPECTED_SHA256" ]; then
              keytool -importkeystore \
                -srckeystore debug.keystore -srcstorepass android -srcalias androiddebugkey \
                -destkeystore /tmp/release.jks -deststorepass android -destkeypass android \
                -destalias upload -deststoretype PKCS12 -noprompt
            fi
          fi

          if [ ! -f "/tmp/release.jks" ] && [ -f "debug.keystore.base64" ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > /tmp/debug_restored.jks
            keytool -importkeystore \
              -srckeystore /tmp/debug_restored.jks -srcstorepass android -srcalias androiddebugkey \
              -destkeystore /tmp/release.jks -deststorepass android -destkeypass android \
              -destalias upload -deststoretype PKCS12 -noprompt
          fi

          if [ ! -f "/tmp/release.jks" ]; then
            echo "ERROR: Could not prepare canonical /tmp/release.jks!"
            exit 1
          fi

          ACTUAL_SHA256=$(keytool -list -v -keystore "/tmp/release.jks" -storepass android -alias upload | grep -oP 'SHA256:\s*\K[0-9A-Fa-f:]+' | tr '[:lower:]' '[:upper:]')
          echo "Verified Release Signing Cert SHA-256: $ACTUAL_SHA256"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: Keystore SHA-256 mismatch! Expected $EXPECTED_SHA256, got $ACTUAL_SHA256"
            exit 1
          fi

      - name: Build Signed Release APK
        run: |
          gradle assembleRelease --build-cache --parallel --no-daemon -x lint -x test

          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$RELEASE_APK" ]; then
            echo "ERROR: Release APK not found at $RELEASE_APK"
            exit 1
          fi

          mkdir -p dist
          APK_FILENAME="Sheildlenz-v${{ env.NEW_NAME }}.apk"
          cp "$RELEASE_APK" "dist/${APK_FILENAME}"

          APKSIGNER=$(find "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}/build-tools" -name "apksigner" 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            CERT_INFO=$("$APKSIGNER" verify --print-certs "dist/${APK_FILENAME}")
            echo "$CERT_INFO"
            if ! echo "$CERT_INFO" | grep -qi "99e4cbc4f6043190f166d6c78b71adce6f7ecb2fb32feb3e957c25203aa9beaf"; then
              echo "ERROR: Built APK certificate does not match canonical signing cert!"
              exit 1
            fi
          fi

          APK_SHA256=$(sha256sum "dist/${APK_FILENAME}" | awk '{print $1}')
          echo "APK_FILENAME=$APK_FILENAME" >> "$GITHUB_ENV"
          echo "APK_SHA256=$APK_SHA256" >> "$GITHUB_ENV"

          ls -lh dist/
        env:
          KEYSTORE_PATH: /tmp/release.jks
          STORE_PASSWORD: android
          KEY_PASSWORD: android

      - name: Commit & Push Version Bump
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          if [ -f "my-upload-key.jks" ]; then
            git add my-upload-key.jks
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Bump version to v${{ env.NEW_NAME }} (Code ${{ env.NEW_CODE }}) [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}" || git rebase --abort || true
            git push origin HEAD:"${{ github.ref_name }}" || true
          fi
          echo "BUMPED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NEW_NAME }}
          target_commitish: ${{ env.BUMPED_SHA }}
          name: Sheildlenz v${{ env.NEW_NAME }} (Build ${{ env.NEW_CODE }})
          files: dist/*.apk
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Automated release v${{ env.NEW_NAME }} (Code ${{ env.NEW_CODE }}, +${{ env.INCREMENT_LABEL }}).
            APK: `Sheildlenz-v${{ env.NEW_NAME }}.apk`
            APK_VERSION_CODE=${{ env.NEW_CODE }}
            APK_SHA256=${{ env.APK_SHA256 }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

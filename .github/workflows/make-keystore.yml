name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate JKS and print Base64
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias ahsantcr_key \
            -storepass "githubsheildlenzahsantcr" \
            -keypass "githubsheildlenzahsantcr" \
            -dname "CN=Ahsan, OU=Dev, O=AhsanTCr, L=Lahore, S=Punjab, C=PK"

          echo "=== BASE64 START ==="
          base64 -w 0 release.jks
          echo ""
          echo "=== BASE64 END ==="
